<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI图片处理工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 40px;
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .drop-zone {
    border: 2px dashed #d0d5dd;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafafa;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #1677ff;
    background: #f0f5ff;
  }
  .drop-zone .icon {
    font-size: 48px;
    margin-bottom: 12px;
    color: #999;
  }
  .drop-zone .text {
    font-size: 15px;
    color: #666;
  }
  .drop-zone .hint {
    font-size: 13px;
    color: #aaa;
    margin-top: 6px;
  }
  .drop-zone input[type="file"] { display: none; }
  .file-list {
    margin-top: 16px;
    display: none;
  }
  .file-list.show { display: block; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #f9f9f9;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .file-item img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 4px;
  }
  .file-item .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item .size {
    color: #999;
    font-size: 12px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 20px;
  }
  .btn-primary {
    background: #1677ff;
    color: #fff;
  }
  .btn-primary:hover { background: #4096ff; }
  .btn-primary:disabled {
    background: #d9d9d9;
    cursor: not-allowed;
  }
  .status {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: #666;
    min-height: 24px;
  }
  .status.error { color: #ff4d4f; }
  .status.success { color: #52c41a; }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #f0f0f0;
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
  }
  .progress-bar.show { display: block; }
  .progress-bar .fill {
    height: 100%;
    background: #1677ff;
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📷 AI图片处理工具</h1>
  <p class="subtitle">上传图片，自动添加真实拍摄特征，规避AI检测</p>

  <div class="drop-zone" id="dropZone">
    <div class="icon">☁️</div>
    <div class="text">点击或拖拽图片到这里</div>
    <div class="hint">支持 JPG / PNG / BMP / WebP，可多选</div>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <div class="file-list" id="fileList"></div>

  <button class="btn btn-primary" id="processBtn" disabled>处理图片</button>

  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
  <div class="status" id="status"></div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const processBtn = document.getElementById('processBtn');
const status = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');

let selectedFiles = [];

// 点击上传
dropZone.addEventListener('click', () => fileInput.click());

// 选择文件
fileInput.addEventListener('change', () => {
  selectFiles(fileInput.files);
  fileInput.value = '';
});

// 拖拽
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  selectFiles(e.dataTransfer.files);
});

function selectFiles(files) {
  const newFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (newFiles.length === 0) {
    status.textContent = '请选择图片文件';
    status.className = 'status error';
    return;
  }
  selectedFiles = newFiles;
  renderFileList();
  processBtn.disabled = false;
  status.textContent = `已选择 ${selectedFiles.length} 张图片`;
  status.className = 'status';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function renderFileList() {
  fileList.innerHTML = '';
  fileList.classList.add('show');
  selectedFiles.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.onload = () => URL.revokeObjectURL(img.src);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = f.name;
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = formatSize(f.size);
    div.appendChild(img);
    div.appendChild(name);
    div.appendChild(size);
    fileList.appendChild(div);
  });
}

// 处理图片
processBtn.addEventListener('click', async () => {
  if (selectedFiles.length === 0) return;

  processBtn.disabled = true;
  processBtn.textContent = '处理中...';
  progressBar.classList.add('show');
  progressFill.style.width = '0%';
  status.textContent = '正在处理...';
  status.className = 'status';

  const formData = new FormData();
  selectedFiles.forEach(f => formData.append('images', f));

  try {
    const resp = await fetch('/upload', { method: 'POST', body: formData });
    const data = await resp.json();

    if (!data.success) {
      status.textContent = data.error || '处理失败';
      status.className = 'status error';
      return;
    }

    progressFill.style.width = '100%';
    status.textContent = `✅ 处理完成！${data.processed}/${data.total} 张成功，正在下载...`;
    status.className = 'status success';

    // 自动下载
    const a = document.createElement('a');
    a.href = data.download;
    a.download = 'processed_images.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    status.textContent = `✅ 处理完成！已下载 ${data.processed} 张`;
  } catch (err) {
    status.textContent = '请求失败，请检查服务是否运行';
    status.className = 'status error';
  } finally {
    processBtn.disabled = false;
    processBtn.textContent = '处理图片';
    setTimeout(() => { progressBar.classList.remove('show'); }, 2000);
  }
});
</script>
</body>
</html>
